name: Cross-platform checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  source-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/release_privacy_check.py

  macos-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r windows/requirements-build.txt
      - run: python -m unittest discover -s windows/tests -v
        env:
          PYTHONPATH: windows
