name: Release both platforms

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: codexcontrol-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    uses: ./.github/workflows/macos-installers.yml

  windows:
    uses: ./.github/workflows/windows-artifacts.yml

  draft:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.windows.outputs.tag }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sanitized-macos-installers
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: release-assets
      - name: Verify downloads and stage the release for review
        shell: bash
        run: |
          set -euo pipefail
          notes="$PWD/docs/releases/v$VERSION.md"
          test -s "$notes"
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$(git rev-parse HEAD)"
          cd release-assets
          files=(
            "CodexControl-$VERSION-macos-arm64.dmg"
            "CodexControl-$VERSION-macos-arm64.pkg"
            "CodexControl-$VERSION-windows-x64-Setup.exe"
            "CodexControl-$VERSION-windows-x64-portable.zip"
            SHA256SUMS-macos.txt SHA256SUMS-windows.txt
          )
          sha256sum -c SHA256SUMS-macos.txt
          sha256sum -c SHA256SUMS-windows.txt
          test "$(jq -r .commit release-build.json)" = "$(git rev-parse HEAD)"
          test "$(jq -r .tag release-build.json)" = "$TAG"
          # Preserve completed releases and any files uploaded during an earlier attempt.
          draft=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -rs --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("duplicate release") else .[0] // empty end')
          if [[ -z "$draft" ]]; then
            gh release create "$TAG" --draft --verify-tag --target "$(git rev-parse HEAD)" \
              --title "CodexControl $VERSION · macOS + Windows" --notes-file "$notes"
          else
            jq -e --arg sha "$(git rev-parse HEAD)" '.draft and .target_commitish == $sha' <<< "$draft" >/dev/null
          fi
          for file in "${files[@]}"; do
            digest=$(sha256sum "$file" | cut -d' ' -f1)
            remote=$(jq -r --arg name "$file" '.assets[]? | select(.name == $name) | .digest' <<< "$draft")
            if [[ -z "$remote" ]]; then
              gh release upload "$TAG" "$file"
            else
              test "$remote" = "sha256:$digest"
            fi
          done
          # Verify the exact six GitHub asset names and digests, including both checksum lists.
          gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/release.json"
          jq -e '.isDraft and (.assets | length == 6)' "$RUNNER_TEMP/release.json" >/dev/null
          for file in "${files[@]}"; do
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            jq -e --arg name "$file" --arg hash "sha256:$hash" \
              'any(.assets[]; .name == $name and .digest == $hash)' "$RUNNER_TEMP/release.json" >/dev/null
          done
