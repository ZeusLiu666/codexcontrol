name: Release both platforms

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Check public source
        run: python3 tools/release_privacy_check.py
      - name: Test macOS
        run: swift test
      - name: Build macOS archive
        run: ./Scripts/build_release_artifacts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ReleaseArtifacts/CodexControl-macos.zip*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements-build.txt
      - name: Check public source
        run: python tools/release_privacy_check.py
      - name: Test Windows
        run: python -m unittest discover -s windows/tests -v
        env:
          PYTHONPATH: windows
      - name: Install official installer compiler
        shell: pwsh
        run: choco install innosetup --version=6.5.3 --no-progress -y
      - name: Build Windows installer and portable archive
        shell: pwsh
        run: ./windows/package_release.ps1 -Clean -Version ($env:GITHUB_REF_NAME -replace '^v', '')
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ReleaseArtifacts/*Setup.exe
            ReleaseArtifacts/*portable.zip
            ReleaseArtifacts/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested platform assets to the same repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CodexControl ${TAG#v} · macOS + Windows" --generate-notes
          gh release upload "$TAG" release-assets/*
